# Analise de qualidade no SonarCloud. Roda pelo job `sonar` do
# .github/workflows/ci.yml; a analise automatica do SonarCloud fica desligada,
# porque ela nao recebe a cobertura dos testes.
sonar.organization=davigpe
sonar.projectKey=davigpe_controlog
sonar.projectName=Controlog

sonar.sourceEncoding=UTF-8

# Sem sonar.sources/sonar.tests de proposito: o SonarCloud analisa o projeto
# inteiro e ignora essas duas propriedades (avisa no log que "nao tem efeito").
# Consequencia: os arquivos de teste entram como codigo comum. Por isso eles
# saem da cobertura abaixo; sem isso, cada teste conta como codigo sem
# cobertura (foi o que derrubou o painel da 1.12.0 para 42%).

# Fora da analise: codigo gerado pelo shadcn (`components/ui`), tipos e o que
# nao e codigo do sistema (migrations, scripts de infraestrutura).
sonar.exclusions=controlog-frontend/src/components/ui/**,controlog-frontend/src/**/*.d.ts,controlog-backend/prisma/migrations/**

# Fora da cobertura:
# - os testes, que sao quem cobre, e nao o que e coberto;
# - o que nao e codigo do sistema: script de dev da raiz e seeds do Prisma;
# - os mesmos recortes do Jest e do Vitest, para o numero do painel bater com
#   o do `npm run test:coverage`.
sonar.coverage.exclusions=\
  controlog-backend/tests/**,\
  controlog-frontend/src/**/*.test.ts,\
  controlog-frontend/src/**/*.test.tsx,\
  controlog-frontend/src/test/**,\
  scripts/**,\
  controlog-backend/prisma/**,\
  controlog-backend/src/server.js,\
  controlog-backend/src/config/**,\
  controlog-frontend/src/main.tsx,\
  controlog-frontend/src/vite-env.d.ts

# Cada lcov e gerado dentro da propria pasta, com caminho relativo a ela; o job
# `sonar` do CI prefixa o nome da pasta antes da analise.
sonar.javascript.lcov.reportPaths=controlog-backend/coverage/lcov.info,controlog-frontend/coverage/lcov.info

# ----------------------------------------------------------------------------
# Achados aceitos. Cada um foi lido e avaliado; a justificativa fica aqui, no
# repositorio, e nao num clique no painel, para ser revisada junto do codigo.
# O filtro e por regra E arquivo: a mesma regra continua valendo no resto do
# projeto. Detalhes em docs/SEGURANCA.md, secao "Achados aceitos do SonarCloud".
# ----------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=senhaTeste,iamDescribe,snsKms,dockerScripts,nginxRoot,devPath

# URL do banco de TESTE, usada so com NODE_ENV=test e apontando para
# localhost. Nao e credencial de ambiente nenhum; producao exige DATABASE_URL.
sonar.issue.ignore.multicriteria.senhaTeste.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.senhaTeste.resourceKey=controlog-backend/src/config/env.js

# Resource '*' em rds:DescribeDBInstances e cloudwatch:PutMetricData, no papel
# da instancia. Sao acoes de leitura de metadados e de publicacao de metrica
# (PutMetricData so aceita '*'; o controle e por namespace). Nenhuma devolve
# segredo nem altera recurso.
sonar.issue.ignore.multicriteria.iamDescribe.ruleKey=cloudformation:S6304
sonar.issue.ignore.multicriteria.iamDescribe.resourceKey=infra/cicd.yml

# Topico SNS sem KMS: os alarmes do CloudWatch nao publicam num topico
# criptografado com a chave gerenciada aws/sns, so com chave propria (CMK),
# que tem custo mensal. O topico carrega apenas o texto dos alarmes.
sonar.issue.ignore.multicriteria.snsKms.ruleKey=cloudformation:S6327
sonar.issue.ignore.multicriteria.snsKms.resourceKey=infra/observabilidade.yml

# npm ci sem --ignore-scripts nas imagens: o backend precisa do postinstall do
# Prisma, que baixa os engines usados pelo `prisma migrate deploy` na subida
# do conteiner. No CI o --ignore-scripts esta aplicado.
sonar.issue.ignore.multicriteria.dockerScripts.ruleKey=docker:S6505
sonar.issue.ignore.multicriteria.dockerScripts.resourceKey=**/Dockerfile

# nginx da imagem oficial: o processo mestre sobe como root para abrir a porta
# 80, e os workers que atendem as requisicoes rodam como o usuario `nginx`. O
# conteiner so serve arquivos estaticos.
sonar.issue.ignore.multicriteria.nginxRoot.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.nginxRoot.resourceKey=controlog-frontend/Dockerfile

# PATH herdado num script que so roda na maquina de quem desenvolve
# (`npm run dev` na raiz), nunca em servidor.
sonar.issue.ignore.multicriteria.devPath.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.devPath.resourceKey=scripts/dev.mjs
