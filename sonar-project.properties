# Analise de qualidade no SonarCloud. Roda pelo job `sonar` do
# .github/workflows/ci.yml; a analise automatica do SonarCloud fica desligada,
# porque ela nao recebe a cobertura dos testes.
sonar.organization=davigpe
sonar.projectKey=davigpe_controlog
sonar.projectName=Controlog

sonar.sourceEncoding=UTF-8

# Sem sonar.sources/sonar.tests de proposito: o SonarCloud analisa o projeto
# inteiro e ignora essas duas propriedades (avisa no log que "nao tem efeito").
# Arquivos de teste (*.test.ts[x], pasta tests/) sao reconhecidos pelo nome e
# nao contam como codigo sem cobertura. O recorte e feito pelas exclusoes.

# Fora da analise: codigo gerado pelo shadcn (`components/ui`), tipos e o que
# nao e codigo do sistema (migrations, scripts de infraestrutura).
sonar.exclusions=controlog-frontend/src/components/ui/**,controlog-frontend/src/**/*.d.ts,controlog-backend/prisma/migrations/**

# Os mesmos recortes da cobertura do Jest e do Vitest, para o numero do painel
# bater com o do `npm run test:coverage`.
sonar.coverage.exclusions=controlog-backend/src/server.js,controlog-backend/src/config/**,controlog-frontend/src/main.tsx,controlog-frontend/src/vite-env.d.ts

# Cada lcov e gerado dentro da propria pasta, com caminho relativo a ela; o job
# `sonar` do CI prefixa o nome da pasta antes da analise.
sonar.javascript.lcov.reportPaths=controlog-backend/coverage/lcov.info,controlog-frontend/coverage/lcov.info
