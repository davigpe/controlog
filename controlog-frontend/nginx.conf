server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A importação de motoristas manda até 1 MB de JSON num POST só
    # (POST /api/motoristas/importar). O padrão do nginx é exatamente 1 MB,
    # então sem esta folga uma planilha cheia levaria 413 antes de chegar na
    # API, e o erro não apareceria em lugar nenhum do log da aplicação.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2;

    # Resolver do Docker. Sem ele, o nginx resolve "api" uma vez na subida e
    # guarda o IP para sempre — recriar o contêiner da API derrubaria o site
    # até o nginx reiniciar. Com um resolver e a URL numa variável, o nome é
    # consultado de novo a cada 10s.
    #
    # Quando o proxy_pass usa variável, o nginx deixa de repassar a URI
    # original sozinho: daí o $request_uri explícito (que já inclui a query
    # string).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $upstream_api http://api:3333;
        proxy_pass $upstream_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # O Express está com `trust proxy` 1, e é deste cabeçalho que o
        # express-rate-limit tira o IP de quem chamou. Sem ele, todo mundo
        # viraria o mesmo cliente aos olhos do limitador.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health checks da API expostos na raiz, para o monitoramento externo não
    # precisar conhecer a rede interna do Compose.
    #
    # `^~ /health` e não `= /health`: com igualdade exata, `/health/db` não casa
    # nenhuma regra específica, cai no `try_files` do `location /` e recebe o
    # index.html da SPA — **200 text/html**. Foi o que aconteceu ao apontar o
    # health check do Route 53 para `/health/db`: ele passou a responder 200
    # sempre, independentemente da API e do banco, ou seja, uma verificação
    # cega, pior do que a anterior.
    #
    # `^~` é prefixo com precedência: cobre `/health` e `/health/db`, e impede
    # que qualquer regex definida depois roube a rota. Caminho desconhecido sob
    # `/health` chega à API e recebe o 404 dela, que é a resposta correta — e
    # não o HTML da SPA com 200.
    location ^~ /health {
        set $upstream_api http://api:3333;
        proxy_pass $upstream_api$request_uri;
        proxy_set_header Host $host;

        # `/health` segue sem log de acesso: é consultado a cada 30 s por
        # vários verificadores. `/health/db` também, porque o log que importa é
        # o da API, e lá o morgan já dispensa /health bem-sucedido e registra a
        # falha.
        access_log off;
    }

    # Os arquivos saem do Vite com hash no nome, então o conteúdo de cada um
    # nunca muda: podem ser guardados para sempre.
    location /assets/ {
        try_files $uri =404;
        # Tudo num add_header só: com `expires 1y` junto, a resposta saía com
        # dois cabeçalhos Cache-Control (um do expires, outro daqui). Os
        # navegadores combinam, mas nem todo cache intermediário lida bem com
        # isso — e um cabeçalho duplicado é sempre um sinal de configuração
        # desatenta.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # O index.html é o único que não pode ser cacheado — é ele que aponta
    # para os assets novos depois de cada deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # React Router: qualquer caminho que não seja um arquivo real volta para
    # o index.html, para que abrir /rotas-do-dia direto (ou dar F5 nela)
    # funcione em vez de dar 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
