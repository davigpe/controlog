name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controlog-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: controlog-backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend — lint, build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controlog-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: controlog-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
