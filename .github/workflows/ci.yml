name: CI/CD

on:
  push:
    # develop tambem roda os testes: e nele que o trabalho se integra no
    # git-flow, e descobrir uma quebra so na hora de fechar a release e tarde.
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — lint e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controlog-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: controlog-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Com cobertura, e nao `npm test`: assim o minimo do jest.config.js
      # (coverageThreshold) reprova o CI, e o lcov segue para o job `sonar`.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: controlog-backend/coverage/lcov.info
          retention-days: 7

  frontend:
    name: Frontend — lint, build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controlog-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: controlog-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Mesmo motivo do backend: os thresholds do vite.config.ts passam a valer.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: controlog-frontend/coverage/lcov.info
          retention-days: 7

  sonar:
    name: Qualidade — SonarCloud
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # O deploy nao espera este job, de proposito: o quality gate aparece no
    # painel e no PR, mas uma queda de nota nao segura uma publicacao que
    # passou em lint, testes e auditoria.
    steps:
      - uses: actions/checkout@v4
        with:
          # Historico completo: o Sonar usa o blame para separar codigo novo
          # de codigo antigo.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: cobertura-backend
          path: controlog-backend/coverage
      - uses: actions/download-artifact@v4
        with:
          name: cobertura-frontend
          path: controlog-frontend/coverage

      # Jest e Vitest gravam o caminho relativo a propria pasta (`SF:src/...`),
      # e o Sonar resolve a partir da raiz. Sem o prefixo, a cobertura aparece
      # como 0% sem erro nenhum.
      - name: Ajustar caminhos do lcov para a raiz
        run: |
          sed -i 's#^SF:#SF:controlog-backend/#' controlog-backend/coverage/lcov.info
          sed -i 's#^SF:#SF:controlog-frontend/#' controlog-frontend/coverage/lcov.info

      # Fixada no commit da v8.4.1, e nao na tag: e uma action de terceiro que
      # recebe um token, e tag pode ser movida.
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dependencias:
    name: Dependencias — auditoria
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # dependency-review precisa ler o grafo de dependencias do PR.
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # O portao e `critical`, nao `high`, e o motivo esta registrado em
      # docs/SEGURANCA.md: sobram quatro advisories de severidade alta cuja
      # correcao exige troca de major (prisma 6 para 7, zod 3 para 4) ou nao
      # existe (deepmerge-ts, transitivo do jest). Portao em `high` ficaria
      # vermelho de forma permanente, e portao sempre vermelho nao e portao:
      # deixa de ser lido. Em `critical` ele esta verde hoje e volta a reprovar
      # no dia em que algo pior entrar.
      - name: Auditar o backend
        working-directory: controlog-backend
        run: npm audit --audit-level=critical

      - name: Auditar o frontend
        working-directory: controlog-frontend
        run: npm audit --audit-level=critical

      # Complementa o portao acima com a semantica certa: reprova quando o PR
      # *introduz* dependencia vulneravel nova, sem depender do nivel absoluto
      # do projeto. E o que impede a divida conhecida de crescer.
      - name: Revisar dependencias novas do PR
        if: github.event_name == 'pull_request'
        # Versao exata de proposito: esta action nao mantem tag flutuante de
        # major, so as especificas. `@v4` nao resolve.
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  deploy:
    name: Deploy em producao
    # Publica so o que passou nos tres. Por isso o deploy vive neste arquivo e
    # nao num separado: `needs` nao atravessa workflows, e as alternativas
    # (workflow_run) abrem espaco para publicar uma versao que falhou.
    needs: [backend, frontend, dependencias]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # Dois deploys simultaneos brigariam pelo mesmo diretorio na instancia.
    # cancel-in-progress fica falso: interromper um deploy no meio do build
    # deixaria a instancia num estado pior do que esperar.
    concurrency:
      group: deploy-producao
      cancel-in-progress: false

    permissions:
      # Unica permissao necessaria: emitir o token OIDC que a AWS troca por
      # credencial temporaria. Nao ha chave de acesso guardada no repositorio.
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1

    steps:
      - name: Autenticar na AWS por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publicar na instancia via SSM
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
        run: |
          set -euo pipefail

          # Cada linha e um comando separado, e o SSM as junta num script so.
          # Escrever assim evita aspas dentro de aspas dentro de JSON, que e
          # onde este tipo de passo costuma quebrar de forma silenciosa.
          cat > /tmp/parametros.json <<'JSON'
          {
            "commands": [
              "set -euo pipefail",
              "cd /home/ec2-user/controlog",
              "sudo -u ec2-user git fetch --prune origin",
              "sudo -u ec2-user git checkout main",
              "sudo -u ec2-user git pull --ff-only origin main",
              "sudo -u ec2-user -H bash scripts/deploy-instancia.sh"
            ]
          }
          JSON

          ID_COMANDO=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters file:///tmp/parametros.json \
            --query Command.CommandId --output text)

          echo "Comando enviado: $ID_COMANDO"

          # O send-command e assincrono e sempre "da certo". Sem acompanhar a
          # execucao ate o fim, o workflow ficaria verde mesmo com o deploy
          # quebrado na instancia.
          ESTADO=Pending
          for _ in $(seq 1 70); do
            sleep 10
            ESTADO=$(aws ssm get-command-invocation \
              --command-id "$ID_COMANDO" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "estado: $ESTADO"
            case "$ESTADO" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo "--- saida da instancia ---"
          aws ssm get-command-invocation \
            --command-id "$ID_COMANDO" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true

          if [ "$ESTADO" != "Success" ]; then
            echo "--- erro ---"
            aws ssm get-command-invocation \
              --command-id "$ID_COMANDO" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text || true
            echo "Deploy terminou em $ESTADO"
            exit 1
          fi
