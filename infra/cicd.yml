AWSTemplateFormatVersion: '2010-09-09'

# Identidades do deploy automatico do Controlog.
#
# Cria tres coisas, e nenhuma delas guarda credencial em lugar nenhum:
#
#   1. O provider OIDC do GitHub, para o Actions provar quem e sem chave.
#   2. A role que o workflow assume, restrita a este repositorio e a este
#      branch, com permissao de mandar um comando e nada mais.
#   3. A role e o instance profile que deixam a EC2 ser gerenciada pelo SSM,
#      que e o que torna o deploy possivel sem abrir a porta 22.
#
# Por que SSM e nao SSH: o security group libera a 22 so para o IP de casa, e
# os runners do GitHub tem IP dinamico. As alternativas seriam abrir a 22 para
# o mundo ou guardar a chave privada da instancia como segredo do repositorio.
# Com o SSM nao ha porta de entrada nova, a chave nao sai da sua maquina, e
# cada execucao fica registrada no CloudTrail com o nome de quem a disparou.
#
# Para criar ou atualizar:
#   aws cloudformation deploy --template-file infra/cicd.yml \
#     --stack-name controlog-cicd --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides InstanceId=i-xxxxxxxx --profile controlog

Description: Identidades OIDC e SSM para o deploy automatico do Controlog

Parameters:
  GitHubOwner:
    Type: String
    Default: davigpe
    Description: Dono do repositorio no GitHub

  GitHubRepo:
    Type: String
    Default: controlog
    Description: Nome do repositorio no GitHub

  DeployBranch:
    Type: String
    Default: main
    Description: Unico branch autorizado a assumir a role de deploy

  InstanceId:
    Type: AWS::EC2::Instance::Id
    Description: Instancia EC2 que recebe o deploy

  DominioDeEmail:
    Type: String
    Default: controlog.app
    Description: Dominio verificado no SES, do qual a instancia pode enviar

Resources:
  # A lista de thumbprints existe por compatibilidade: a AWS valida este
  # provider pelas CAs publicas e ignora o valor. O campo segue aqui porque
  # omiti-lo em alguns caminhos de criacao ainda gera erro.
  ProviderOidcDoGitHub:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  # Quem o workflow vira ao rodar.
  RoleDeDeployDoGitHub:
    Type: AWS::IAM::Role
    Properties:
      RoleName: controlog-github-deploy
      Description: Assumida pelo GitHub Actions para disparar o deploy via SSM
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ProviderOidcDoGitHub
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              # O "aud" impede que um token emitido para outro destino sirva
              # aqui. Sem ele, a confianca ficaria larga demais.
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # StringEquals, e nao StringLike: nao ha curinga nenhum neste
                # valor, e um curinga esquecido em "sub" e a forma classica de
                # deixar qualquer repositorio do GitHub assumir a role.
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/${DeployBranch}'
      Policies:
        - PolicyName: disparar-deploy-por-ssm
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Mandar o comando, so nesta instancia e so por este documento.
              - Sid: EnviarComandoNaInstanciaDoControlog
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript'
              # Ler o resultado. Resource "*" nao e desleixo: estas duas acoes
              # nao aceitam permissao por recurso, e restringi-las por ARN faz
              # a chamada falhar com AccessDenied.
              - Sid: AcompanharOResultadoDoComando
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: '*'

  # O que deixa a instancia conversar com o SSM.
  RoleSsmDaInstancia:
    Type: AWS::IAM::Role
    Properties:
      RoleName: controlog-ec2-ssm
      Description: Permite que a EC2 do Controlog seja gerenciada pelo SSM e envie e-mail pelo SES
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        # E daqui que a aplicacao tira permissao para enviar e-mail. Pelo
        # instance profile, e nao por chave de API no .env.production: o SDK
        # pega a credencial do metadata da instancia, entao nao ha segredo de
        # e-mail em lugar nenhum do repositorio nem do servidor.
        - PolicyName: enviar-email-transacional
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EnviarPelaIdentidadeDoControlog
                Effect: Allow
                Action: ses:SendEmail
                # Restrito a identidade do dominio: a instancia nao consegue
                # enviar usando nenhuma outra identidade verificada que venha a
                # existir nesta conta.
                Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${DominioDeEmail}'

        # O AmazonSSMManagedInstanceCore nao cobre nada disto: ele da acesso aos
        # canais do SSM, nao ao CloudWatch. Sem estas duas permissoes o driver
        # awslogs do Docker e o scripts/metricas-instancia.sh falham, e falham
        # de forma discreta: o contêiner sobe e o log simplesmente nao aparece.
        - PolicyName: publicar-observabilidade
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EscreverNoLogDaAplicacao
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                # Restrito ao grupo da aplicacao, criado pela stack de
                # observabilidade. A instancia nao escreve em outro log group da
                # conta, e nao tem logs:CreateLogGroup: se o grupo nao existir,
                # e porque a stack nao subiu, e o certo e falhar e nao criar um
                # grupo sem retencao definida.
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/controlog/aplicacao:*'

              - Sid: LerASenhaRotacionadaDoBanco
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                # Restrito aos segredos gerenciados pelo proprio RDS, que sao os
                # unicos com o prefixo `rds!db-`. A instancia nao alcanca nenhum
                # outro segredo que venha a existir nesta conta.
                #
                # Necessario porque o banco usa senha mestra gerenciada pela
                # AWS, com rotacao a cada 7 dias. Sem isto, a cada rotacao a
                # credencial do .env.production fica velha e todo acesso ao
                # banco passa a responder 500 — foi o que aconteceu em
                # 16/11/2026, com cinco horas de login quebrado.
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!db-*'

              - Sid: DescobrirOSegredoDoBanco
                Effect: Allow
                # Para o script achar o ARN do segredo a partir da instancia de
                # banco, em vez de ter o ARN fixo em arquivo. describe nao
                # devolve segredo nenhum.
                Action: rds:DescribeDBInstances
                Resource: '*'

              - Sid: PublicarMetricasDaInstancia
                Effect: Allow
                Action: cloudwatch:PutMetricData
                # PutMetricData nao aceita restricao por recurso; o controle
                # possivel e por namespace.
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: Controlog/Instancia

  PerfilSsmDaInstancia:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: controlog-ec2-ssm
      Roles:
        - !Ref RoleSsmDaInstancia

Outputs:
  ArnDaRoleDeDeploy:
    Description: Valor de AWS_DEPLOY_ROLE_ARN nas variaveis do repositorio
    Value: !GetAtt RoleDeDeployDoGitHub.Arn

  NomeDoPerfilDaInstancia:
    Description: Instance profile a associar a instancia EC2
    Value: !Ref PerfilSsmDaInstancia
